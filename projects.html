<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseMoment - Projects</title>

    <link rel="icon" type="image/jpeg" href="Camera.jpg">
    
    <style>
        body {
          margin: 0;
          padding: 20px;
          background-color: #ffd2e1;
          font-family: Playfair Display;
          display: flex;
          flex-direction: column;  
          align-items: center;     
        }

        .ylapalkki-säiliö {
          display: flex;
          justify-content: center; 
          align-items: center;
          width: 100%;             
          margin-top: 10px;
          margin-bottom: 15px;  
          position: relative;
        }

        .ylapalkki-logo {
          position: absolute;
          left: 0;
          max-width: 280px;
          height: auto;
          display: block;
          margin-top: 40px;
        }

        .kapseli-valikko {
          display: inline-flex;
          border: 2px solid #000000;
          border-radius: 30px;
          overflow: hidden;
          background-color: #ffffff;
          padding: 0;
          margin: 0;
          z-index: 10;
        }

        .kapseli-valikko a {
          display: block;
          padding: 10px 24px; 
          color: #000000;
          text-decoration: none;
          font-size: 18px; 
          font-weight: 500;
          letter-spacing: 2px;
          text-align: center;
          border-right: 2px solid #000000; 
        }

        .kapseli-valikko a:last-child {
          border-right: none;
        }

        .kapseli-valikko a:hover {
          font-weight: bold;
          background-color: #f0f0f0;
        }

        .infoteksti {
          font-size: 26px;      
          text-align: center;
          margin-top: 60px; 
          margin-bottom: 40px;
          letter-spacing: 2px; 
          max-width: 1100px;
          text-transform: lowercase; 
        }

        .layout-rivi {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 50px;          
          width: 100%;
          max-width: 1300px;
          margin-bottom: 20px;
          flex-wrap: wrap;
        }

        .layout-sarake {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
        }

        .tahti-koriste {
          font-size: 60px;    
          color: #707070;
          line-height: 1.2;
          user-select: none;
        }

        .filminauha {
          width: 120px;         
          height: 330px;       
          border: 12px solid #000000;
          background-color: #000000;
          display: flex;
          flex-direction: column;
          gap: 8px;
          box-sizing: content-box;
          padding: 12px 0;
          position: relative;
          transition: transform 0.2s;
        }

        .ruutu {
          background-color: #ffffff;
          flex: 1;
        }

        .filmi-teksti {
          background-color: #000000;
          color: #ffffff;
          font-size: 11px;     
          font-family: Arial, sans-serif;
          text-align: center;
          padding: 6px 0;
          letter-spacing: 1px;
        }

        .valittu-nauha {
          border-color: #ff0055;
          transform: scale(1.03);
        }

        .musta-nappi {
          background-color: #000000;
          color: #ffffff;
          border: none;
          padding: 10px 25px;  
          font-family: Playfair Display;
          font-size: 20px;     
          letter-spacing: 2px;
          cursor: pointer;
          text-transform: uppercase;
        }
        
        .musta-nappi:hover {
          background-color: #71797E;
        }

        @media screen and (max-width: 1150px) {
          body {
            padding: 10px;
          }
          
          .ylapalkki-säiliö {
            flex-direction: column !important; 
            gap: 15px;
            margin-bottom: 20px !important;
          }

          .ylapalkki-logo {
            position: static !important; 
            max-width: 150px;
            margin: 0 auto !important;
            margin-top: 0 !important;
          }

          .kapseli-valikko {
            display: flex !important;
            width: 100% !important;
            border-radius: 25px !important;
          }

          .kapseli-valikko a {
            flex: 1 !important;
            padding: 12px 0 !important; 
            font-size: 11px !important; 
            letter-spacing: 0px !important;
          }

          .infoteksti {
            font-size: 18px !important;
            letter-spacing: 1px !important;
            margin-top: 20px !important;
            margin-bottom: 30px !important;
            padding: 0 10px !important;
            box-sizing: border-box !important;
          }

          .layout-rivi {
              display: flex;
            flex-direction: row !important;
              justify-content: center;
              align-items: flex-start;
              gap: 8px;
              width: 100%;
              box-sizing: border-box;
          }
            
         .layout-sarake {
             flex: 1;
             max-width: 31%;
             display: flex;
             flex-direction: column;
             align-items: center;
        }
            
        .filminauha {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .ruutu {
            height: 50px;
            margin-bottom: 5px;
        }

        .filmi-teksti {
            font-size: 10px;
            line-height: 1.2;
            margin-top: 4px;
        } 

        .musta-nappi {
            width: 100%;
            font-size: 9px;
            padding: 6px 0;
            margin-top: 8px;
            letter-spacing: 0px;
        }

        .tahti-koriste {
            display: none;
        } 
    </style>
</head>
<body>
    
    <div class="ylapalkki-säiliö">
        <img src="Logo.jpg" alt="PoseMoment" class="ylapalkki-logo">
        
        <nav class="kapseli-valikko">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="skills.html">Skills</a>
          <a href="contact.html">Contact</a>
        </nav>
    </div>

    <div class="infoteksti">choose your layout, strike a pose, and capture memories that matter</div>

    <div class="layout-rivi">
        <div class="tahti-koriste">✦<br>✦<br>✦</div>

        <div class="layout-sarake">
            <div class="filminauha" id="nauha-A">
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="filmi-teksti">Layout A<br>4 Pose</div>
            </div>
            <button class="musta-nappi" onclick="valitsePohja('nauha-A')">CHOOSE</button>
        </div>

        <div class="layout-sarake">
            <div class="filminauha" id="nauha-B">
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="filmi-teksti">Layout B<br>3 Pose</div>
            </div>
            <button class="musta-nappi" onclick="valitsePohja('nauha-B')">CHOOSE</button>
        </div> 

        <div class="layout-sarake">
            <div class="filminauha" id="nauha-C">
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="filmi-teksti">Layout C<br>2 Pose</div>
            </div>
            <button class="musta-nappi" onclick="valitsePohja('nauha-C')">CHOOSE</button>
        </div>

        <div class="tahti-koriste">✦<br>✦<br>✦</div>
    </div>

    <script>
        function valitsePohja(nauhaId) {
            document.querySelectorAll('.filminauha').forEach(function(nauha) {
                nauha.classList.remove('valittu-nauha');
            });
            document.getElementById(nauhaId).classList.add('valittu-nauha');
            
            alert("Layout selected! The photobooth feature will open soon :)");
        }
    </script>
</body>
</html>
