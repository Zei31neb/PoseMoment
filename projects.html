<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseMoment - Projects</title>
    
    <style>
        body {
          margin: 0;
          padding: 20px;
          background-color: #ffd2e1;
          font-family: 'Playfair Display', serif;
          display: flex;
          flex-direction: column;  
          align-items: center;     
        }


        .ylapalkki-säiliö {
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100%;
          max-width: 1200px;
          margin-top: 20px;
          margin-bottom: 60px; 
          position: relative; 
        }


        .ylapalkki-logo {
          position: absolute;
          left: -600px;     
          height: 280px;     
          width: auto;
          margin-top: 150px;   
        }


        .kapseli-valikko {
          display: inline-flex;
          border: 2px solid #000000;
          border-radius: 30px;
          overflow: hidden;
          background-color: #ffffff;
          padding: 0;
          margin: 0;
        }


        .kapseli-valikko a {
          display: block;
          padding: 16px 35px;
          color: #000000;
          text-decoration: none;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 2px;
          text-align: center;
          border-right: 2px solid #000000; 
        }


        .kapseli-valikko a:last-child {
          border-right: none;
        }


        .kapseli-valikko a:hover {
          font-weight: bold;
          background-color: #f0f0f0;
        }


        .infoteksti {
          font-size: 38px;      
          text-align: center;
          margin-bottom: 40px;
          letter-spacing: 4px; 
          max-width: 1100px;
          text-transform: lowercase; 
        }


        .layout-rivi {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 90px;          
          width: 100%;
          max-width: 1300px;
          margin-bottom: 20px;
          flex-wrap: wrap;
        }


        .layout-sarake {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
        }


        .tahti-koriste {
          font-size: 85px;    
          color: #707070;
          line-height: 1.2;
          user-select: none;
        }


        .filminauha {
          width: 165px;         
          height: 450px;       
          border: 16px solid #000000;
          background-color: #000000;
          display: flex;
          flex-direction: column;
          gap: 12px;
          box-sizing: content-box;
          padding: 12px 0;
          position: relative;
          transition: transform 0.2s;
        }


        .ruutu {
          background-color: #ffffff;
          flex: 1;
        }


        .filmi-teksti {
          background-color: #000000;
          color: #ffffff;
          font-size: 14px;     
          font-family: Arial, sans-serif;
          text-align: center;
          padding: 6px 0;
          letter-spacing: 1px;
        }


        .valittu-nauha {
          border-color: #ff0055;
          transform: scale(1.03);
        }


        .musta-nappi {
          background-color: #000000;
          color: #ffffff;
          border: none;
          padding: 14px 35px;  
          font-family: 'Playfair Display', serif;
          font-size: 20px;     
          letter-spacing: 2px;
          cursor: pointer;
          text-transform: uppercase;
        }
        
        .musta-nappi:hover {
          background-color: #71797E;
        }

        @media screen and (max-width: 768px) {
          
          .tahti-koriste { 
            display: none !important; 
          }

          .ylapalkki-säiliö {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            margin-top: 10px !important;
            margin-bottom: 20px !important;
            width: 100% !important;
            box-sizing: border-box !important;
          }

          .ylapalkki-logo {
            position: static !important; 
            margin: 0 auto 20px auto !important;
            height: 140px !important; 
            width: auto !important;
            display: block !important; 
          }

          .kapseli-valikko {
            display: flex !important;
            width: 100% !important;
            max-width: 100% !important;
            border: 2px solid #000000 !important;
            border-radius: 25px !important;
            box-sizing: border-box !important;
            padding: 0 !important;
            margin: 0 !important;
          }

          .kapseli-valikko a {
            flex: 1 !important;
            padding: 10px 0 !important; 
            font-size: 11px !important; 
            letter-spacing: 0px !important;
            border-right: 2px solid #000000 !important;
            border-bottom: none !important;
          }

          .kapseli-valikko a:last-child {
            border-right: none !important;
          }

          .infoteksti {
            font-size: 18px !important;
            letter-spacing: 1px !important;
            margin-top: 20px !important;
            margin-bottom: 30px !important;
            padding: 0 10px !important;
            box-sizing: border-box !important;
          }

          .layout-rivi {
            flex-direction: column !important;
            gap: 40px !important;
          }
        }
    </style>
</head>
<body>
    
    <div class="ylapalkki-säiliö">
        <img src="img/PoseMoment.jpg" alt="PoseMoment" class="ylapalkki-logo">
        
        <nav class="kapseli-valikko">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="skills.html">Skills</a>
          <a href="contact.html">Contact</a>
        </nav>
    </div>


    <div class="infoteksti">choose your layout, strike a pose, and capture memories that matter</div>


    <div class="layout-rivi">
        <div class="tahti-koriste">✦<br>✦<br>✦</div>


        <div class="layout-sarake">
            <div class="filminauha" id="nauha-A">
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="filmi-teksti">Layout A<br>4 Pose</div>
            </div>
            <button class="musta-nappi" onclick="valitsePohja('nauha-A')">CHOOSE</button>
        </div>


        <div class="layout-sarake">
            <div class="filminauha" id="nauha-B">
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="filmi-teksti">Layout B<br>3 Pose</div>
            </div>
            <button class="musta-nappi" onclick="valitsePohja('nauha-B')">CHOOSE</button>
        </div> 


        <div class="layout-sarake">
            <div class="filminauha" id="nauha-C">
                <div class="ruutu"></div>
                <div class="ruutu"></div>
                <div class="filmi-teksti">Layout C<br>2 Pose</div>
            </div>
            <button class="musta-nappi" onclick="valitsePohja('nauha-C')">CHOOSE</button>
        </div>


        <div class="tahti-koriste">✦<br>✦<br>✦</div>
    </div>


    <script>
        function valitsePohja(nauhaId) {
            document.querySelectorAll('.filminauha').forEach(function(nauha) {
                nauha.classList.remove('valittu-nauha');
            });
            document.getElementById(nauhaId).classList.add('valittu-nauha');
            alert("Layout selected! The photobooth feature will open soon :)");
        }
    </script>
</body>
</html>
