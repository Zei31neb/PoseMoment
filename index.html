<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseMoment</title>
    
    <style>
        body {
          margin: 0;
          padding: 20px;
          background-color: #ffd2e1;
          font-family: 'Playfair Display', serif;
          display: flex;
          flex-direction: column;  
          align-items: center;     
        }


        .valikko-säiliö {
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100%;
          margin-top: 20px;
          margin-bottom: 40px;
        }


        .kapseli-valikko {
          display: inline-flex;
          border: 2px solid #000000;
          border-radius: 30px;
          overflow: hidden;
          background-color: #ffffff;
          padding: 0;
          margin: 0;
        }


        .kapseli-valikko a {
          display: block;
          padding: 16px 35px;
          color: #000000;
          text-decoration: none;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 2px;
          text-align: center;
          border-right: 2px solid #000000; 
        }


        .kapseli-valikko a:last-child {
          border-right: none;
        }


        .kapseli-valikko a:hover {
          font-weight: bold;
          background-color: #f0f0f0;
        }


        h1 {
          margin-top: 20px;
          margin-bottom: 15px;
          font-size: 40px;
          text-align: center;
          letter-spacing: 4px; 
          font-family: 'Playfair Display', serif; 
        }


        p {
          font-family: 'Playfair Display', serif;
          font-size: 34px;
          text-align: center;
          max-width: 1000px;
        }

        .paasivu-logo {
          width: 950px;
          height: auto;
          display: block;
          margin: 0 auto;
        }

        @media screen and (max-width: 768px) {
          
          body {
            padding: 15px !important;
          }

          .valikko-säiliö {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            margin-top: 10px !important;
            margin-bottom: 20px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            order: 2; 
          }

          .paasivu-logo {
            order: 1; 
            position: static !important; 
            margin: 0 auto 20px auto !important;
            width: 100% !important;
            max-width: 200px !important; 
            height: auto !important;
            display: block !important; 
          }

          h1 {
            order: 3;
            font-size: 28px !important;
            margin-top: 20px !important;
            margin-bottom: 15px !important;
            text-align: center !important;
          }

          p {
            order: 4;
            font-size: 16px !important;
            text-align: center !important;
            line-height: 1.5 !important;
            margin-bottom: 20px !important;
            padding: 0 10px !important;
            box-sizing: border-box !important;
          }

          .kapseli-valikko {
            display: flex !important;
            width: 100% !important;
            max-width: 100% !important;
            border: 2px solid #000000 !important;
            border-radius: 25px !important;
            box-sizing: border-box !important;
            padding: 0 !important;
            margin: 0 !important;
          }

          .kapseli-valikko a {
            flex: 1 !important;
            padding: 12px 0 !important; 
            font-size: 11px !important; 
            letter-spacing: 0px !important;
            border-right: 2px solid #000000 !important;
            border-bottom: none !important;
          }

          .kapseli-valikko a:last-child {
            border-right: none !important;
          }
        }

    </style>
</head>
<body>
    
    <div class="valikko-säiliö">
        <nav class="kapseli-valikko">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="skills.html">Skills</a>
          <a href="contact.html">Contact</a>
        </nav>
    </div>

    <img src="PoseMoment.jpg" alt="PoseMoment" class="paasivu-logo">

    <h1><strong>Welcome to</strong></h1>
    
    <p>Your moments, your way. <strong><em>PoseMoment</em></strong> is the easy-to-use photobooth that goes wherever you do. <br>Come try it and start capturing memories today!</p>
    
    <p>Click on <strong>'Projects'</strong> to launch the photobooth and start capturing memories :)</p>

</body>
</html>
