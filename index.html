<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseMoment</title>
    
    <style>
        body {
          margin: 0;
          padding: 20px;
          background-color: #ffd2e1;
          font-family: Playfair Display;
          display: flex;
          flex-direction: column;  
          align-items: center;     
        }

        .valikko-säiliö {
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100%;
          margin-top: 20px;
          margin-bottom: 25px; 
        }

        .kapseli-valikko {
          display: inline-flex;
          border: 2px solid #000000;
          border-radius: 30px;
          overflow: hidden;
          background-color: #ffffff;
          padding: 0;
          margin: 0;
        }

        .kapseli-valikko a {
          display: block;
          padding: 16px 35px;
          color: #000000;
          text-decoration: none;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 2px;
          text-align: center;
          border-right: 2px solid #000000; 
        }

        .kapseli-valikko a:last-child {
          border-right: none;
        }

        .kapseli-valikko a:hover {
          font-weight: bold;
          background-color: #f0f0f0;
        }

        h1 {
          margin-top: 20px;
          margin-bottom: 15px;
          font-size: 40px;
          text-align: center;
          letter-spacing: 4px; 
          font-family: Playfair Display; 
        }

        p {
          font-family: Playfair Display;
          font-size: 34px;
          text-align: center;
          max-width: 1100px; 
          margin-top: 20px;
          margin-bottom: 20px;
          line-height: 1.4;
        }

        .paasivu-logo {
          width: 100%;
          max-width: 620px;
          height: auto;
          display: block;
          margin: 10px auto; 
        }

        @media screen and (max-width: 1150px) {
          body {
            padding: 15px !important;
          }

          .valikko-säiliö {
            margin-top: 10px !important;
            margin-bottom: 20px !important;
          }

          .kapseli-valikko {
            display: flex !important;
            width: 100% !important;
            border-radius: 25px !important;
          }

          .kapseli-valikko a {
            flex: 1 !important;
            padding: 12px 0 !important; 
            font-size: 11px !important; 
            letter-spacing: 0px !important;
          }

          h1 {
            font-size: 28px !important;
          }

          .paasivu-logo {
            max-width: 100% !important;
          }

          p {
            font-size: 16px !important;
            line-height: 1.5 !important;
          }
        }
    </style>
</head>
<body>
    
    <div class="valikko-säiliö">
        <nav class="kapseli-valikko">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="skills.html">Skills</a>
          <a href="contact.html">Contact</a>
        </nav>
    </div>

    <h1><strong>Welcome to</strong></h1>
    
    <img src="Logo.jpg" alt="PoseMoment" class="paasivu-logo">
    
    <p>Your moments, your way. <strong><em>PoseMoment</em></strong> is the easy-to-use photobooth that goes wherever you do. <br>Come try it and start capturing memories today!</p>
    <p>Click on <strong>'Projects'</strong> to launch the photobooth and start capturing memories :)</p>

</body>
</html>
