<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseMoment - Contact</title>

    <link rel="icon" type="image/jpeg" href="Camera.jpg">
    
    <style>
        body {
          margin: 0;
          padding: 20px;
          background-color: #ffd2e1;
          font-family: Playfair Display;
          display: flex;
          flex-direction: column;  
          align-items: center;     
        }

        .ylapalkki-säiliö {
          display: flex;
          justify-content: center; 
          align-items: center;
          width: 100%;             
          margin-top: 10px;
          margin-bottom: 15px;  
          position: relative; 
        }

        .ylapalkki-logo {
          position: absolute;
          left: 0;
          max-width: 280px;
          height: auto;
          display: block;
          margin-top: 40px;
        }

        .kapseli-valikko {
          display: inline-flex;
          border: 2px solid #000000;
          border-radius: 30px;
          overflow: hidden;
          background-color: #ffffff;
          padding: 0;
          margin: 0;
          z-index: 10;
        }

        .kapseli-valikko a {
          display: block;
          padding: 10px 24px; 
          color: #000000;
          text-decoration: none;
          font-size: 18px; 
          font-weight: 500;
          letter-spacing: 2px;
          text-align: center;
          border-right: 2px solid #000000; 
        }

        .kapseli-valikko a:last-child {
          border-right: none;
        }

        .kapseli-valikko a:hover {
          font-weight: bold;
          background-color: #f0f0f0;
        }

        .sisalto-laatikko {
          max-width: 800px;
          width: 100%;
          padding: 0 20px;
          box-sizing: border-box;
          margin-top: 10px; 
        }

        h1 {
          font-size: 32px;
          text-align: center;
          letter-spacing: 2px;
          margin-top: 20px; 
          margin-bottom: 25px;
          font-weight: bold;
        }

        p {
          font-size: 18px;
          text-align: center;
          line-height: 1.6;
          margin-bottom: 40px;
          letter-spacing: 0.5px;
        }

        form {
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100%;
        }

        .lomake-ryhma {
          display: flex;
          align-items: center;
          margin-bottom: 25px;
          width: 100%;
          max-width: 600px;
        }

        .lomake-ryhma label {
          font-size: 18px;
          font-weight: bold;
          width: 120px; 
          text-align: left;
        }

        .lomake-ryhma input, .lomake-ryhma textarea {
          flex: 1;
          padding: 10px;
          border: 2px solid #000000;
          background-color: #ffffff;
          font-family: Arial, sans-serif;
          font-size: 16px;
          box-sizing: border-box;
        }

        .lomake-ryhma textarea {
          height: 120px;
          resize: none; 
        }

        .lahetys-alue {
          width: 100%;
          max-width: 600px;
          display: flex;
          justify-content: center; 
          margin-top: 20px;
        }

        .valkoinen-send-nappi {
          background-color: #ffffff;
          color: #000000;
          border: 2px solid #000000;
          border-radius: 20px;
          padding: 12px 45px;
          font-family: 'Playfair Display', serif;
          font-size: 18px;
          letter-spacing: 2px;
          cursor: pointer;
          box-shadow: 4px 4px 0px #000000;
          transition: transform 0.1s, box-shadow 0.1s;
        }

        .valkoinen-send-nappi:hover {
          background-color: #f0f0f0;
        }
        
        .valkoinen-send-nappi:active {
          transform: translate(2px, 2px);
          box-shadow: 2px 2px 0px #000000;
        }

        @media screen and (max-width: 1150px) {
          body {
            padding: 15px;
          }
          
          .ylapalkki-säiliö {
            flex-direction: column !important; 
            gap: 15px;
            margin-bottom: 20px !important;
          }

          .ylapalkki-logo {
            position: static !important; 
            max-width: 150px;
            margin: 0 auto !important;
            margin-top: 0 !important;
          }

          .kapseli-valikko {
            display: flex !important;
            width: 100% !important;
            border-radius: 25px !important;
          }

          .kapseli-valikko a {
            flex: 1 !important;
            padding: 12px 0 !important; 
            font-size: 11px !important; 
            letter-spacing: 0px !important;
          }
          
          .sisalto-laatikko {
            margin-top: 10px !important;
          }

          h1 {
            font-size: 24px !important;
            margin-top: 15px !important;
          }

          p {
            font-size: 14px !important;
            line-height: 1.5;
          }

          .lomake-ryhma {
            flex-direction: column !important;
            align-items: flex-start !important;
            margin-bottom: 15px !important;
          }

          .lomake-ryhma label {
            width: 100% !important;
            font-size: 16px !important;
            margin-bottom: 5px !important;
          }

          .lomake-ryhma input, .lomake-ryhma textarea {
            width: 100% !important;
            font-size: 14px !important;
          }

          .valkoinen-send-nappi {
            font-size: 16px !important;
            padding: 10px 40px !important;
            width: 100% !important;
            max-width: 280px !important;
          }
        }
    </style>
</head>
<body>
    
    <div class="ylapalkki-säiliö">
        <img src="Logo.jpg" alt="PoseMoment" class="ylapalkki-logo">
        
        <nav class="kapseli-valikko">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="skills.html">Skills</a>
          <a href="contact.html">Contact</a>
        </nav>
    </div>

    <div class="sisalto-laatikko">
        <h1>Contact Me</h1>
        
        <p>If you want to give feedback about my PoseMoment project or ask anything about my design process, you can contact me here.</p>

         <form id="contact-form" method="POST">   
             
            <input type="hidden" name="access_key" value="f332f898-d88c-4ae7-88c0-f4ce565ab657">
            <input type="hidden" name="subject" value="Uusi viesti PoseMoment-sivustolta!">
            
            <div class="lomake-ryhma">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="lomake-ryhma">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="lomake-ryhma">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <div class="lahetys-alue">
                <button type="submit" class="valkoinen-send-nappi">Send</button>
            </div>
      <script>
        const lomake = document.getElementById('contact-form');

        lomake.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(lomake);
            
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
                     })
            .then(function(response) {
                if (response.ok) {
                    alert('Message sent! Thank you :)');
                    lomake.reset(); 
                } else {
                    alert('Something went wrong, please try again.');
                }
            })
            .catch(function(error) {
                alert('Something went wrong, please try again.');
            });
        });
    </script>
        </form>
    </div>
</body>
</html>
