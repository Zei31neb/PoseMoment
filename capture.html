<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseMoment - Capture</title>

    <style>
        body {
          margin: 0;
          padding: 20px;
          background-color: #ffd2e1;
          font-family: Playfair Display;
          display: flex;
          flex-direction: column;  
          align-items: center;     
        }

        .ylapalkki-säiliö {
          display: flex;
          justify-content: center; 
          align-items: center;
          width: 100%;             
          margin-top: 10px;
          margin-bottom: 15px;  
          position: relative;
        }

        .ylapalkki-logo {
          position: absolute;
          left: 0;
          max-width: 280px;
          height: auto;
          display: block;
          margin-top: 40px;
        }

        .kapseli-valikko {
          display: inline-flex;
          border: 2px solid #000000;
          border-radius: 30px;
          overflow: hidden;
          background-color: #ffffff;
          padding: 0;
          margin: 0;
          z-index: 10;
        }

        .kapseli-valikko a {
          display: block;
          padding: 10px 24px; 
          color: #000000;
          text-decoration: none;
          font-size: 18px; 
          font-weight: 500;
          letter-spacing: 2px;
          text-align: center;
          border-right: 2px solid #000000; 
        }

        .kapseli-valikko a:last-child {
          border-right: none;
        }

        .kapseli-valikko a:hover {
          font-weight: bold;
          background-color: #f0f0f0;
        }

        .paaosa {
          display: flex;
          justify-content: center;
          align-items: flex-start;
          gap: 40px;
          margin-top: 50px;
        }

        .kamera-sarake {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
        }

        .musta-laatikko {
          background-color: #000000;
          color: #ffffff;
          font-size: 14px;
          letter-spacing: 3px;
          padding: 6px 14px;
          text-align: center;
        }

        .kamera-ruutu {
          position: relative;
          width: 640px;
          height: 400px;
          background-color: #ffffff;
          border: 1px solid #000000;
        }

        .kamera-ruutu video {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transform: scaleX(-1);
        }

        .viesti {
          position: absolute;
          top: 45%;
          width: 100%;
          text-align: center;
          font-size: 20px;
        }

        .lasku {
          display: none;
          position: absolute;
          top: 0;
          width: 100%;
          text-align: center;
          font-size: 140px;
          line-height: 400px;
          color: #ffffff;
          text-shadow: 0 0 10px #000000;
        }

        .aika-nappi {
          background-color: #000000;
          color: #ffffff;
          border: 2px solid #000000;
          font-family: Playfair Display;
          font-size: 14px;
          padding: 6px 14px;
          cursor: pointer;
        }

        .valittu {
          background-color: #ffffff;
          color: #000000;
        }

        .valkoinen-nappi {
          background-color: #ffffff;
          border: 1px solid #000000;
          border-radius: 10px;
          box-shadow: 4px 4px 0 #000000;
          padding: 12px 28px;
          font-family: Playfair Display;
          font-size: 16px;
          letter-spacing: 3px;
          cursor: pointer;
        }

        .musta-nappi {
          background-color: #000000;
          color: #ffffff;
          border: none;
          padding: 12px 30px;
          font-family: Playfair Display;
          font-size: 18px;
          letter-spacing: 2px;
          cursor: pointer;
          text-transform: uppercase;
        }

        .musta-nappi:hover {
          background-color: #71797E;
        }

        button:disabled {
          opacity: 0.4;
          cursor: not-allowed;
        }

        .pikkukuvat {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        .pikkukuva {
          width: 110px;
          height: 68px;
          border: 1px solid #000000;
          background-color: #ffe9f0;
          text-align: center;
          line-height: 68px;
          font-size: 22px;
          color: #707070;
        }

        .pikkukuva img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        @media screen and (max-width: 1150px) {
          body {
            padding: 15px;
          }
          
          .ylapalkki-säiliö {
            flex-direction: column !important; 
            gap: 15px;
            margin-bottom: 20px !important;
          }

          .ylapalkki-logo {
            position: static !important; 
            max-width: 150px;
            margin: 0 auto !important;
            margin-top: 0 !important;
          }

          .kapseli-valikko {
            display: flex !important;
            width: 100% !important;
            border-radius: 25px !important;
          }

          .kapseli-valikko a {
            flex: 1 !important;
            padding: 12px 0 !important; 
            font-size: 11px !important; 
            letter-spacing: 0px !important;
          }

          .paaosa {
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
          }

          .kamera-ruutu {
            width: 100%;
            height: 300px;
          }

          .lasku {
            font-size: 90px;
            line-height: 300px;
          }

          .pikkukuvat {
            flex-direction: row;
          }
        }
    </style>
</head>
<body>

    <div class="ylapalkki-säiliö">
        <img src="Logo.jpg" alt="PoseMoment" class="ylapalkki-logo">
        
        <nav class="kapseli-valikko">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="skills.html">Skills</a>
          <a href="contact.html">Contact</a>
        </nav>
    </div>

    <div class="paaosa">

        <div class="kamera-sarake">
            <div class="kamera-ruutu">
                <video id="video" autoplay playsinline muted></video>
                <div class="viesti" id="viesti">Starting camera...</div>
                <div class="lasku" id="lasku"></div>
            </div>

            <div>
                <span class="musta-laatikko">Time to pose:</span>
                <button class="aika-nappi valittu" id="aika-3" onclick="valitseAika(3)">3s</button>
                <button class="aika-nappi" id="aika-5" onclick="valitseAika(5)">5s</button>
            </div>

            <div>
                <button class="valkoinen-nappi" id="aloita-nappi" onclick="aloitaKuvaus()" disabled>Start Capture<br></button>
                <button class="musta-nappi" id="next-nappi" onclick="seuraava()" disabled>Next</button>
            </div>
        </div>

        <div class="pikkukuvat">
            <div class="pikkukuva" id="kuva0">1</div>
            <div class="pikkukuva" id="kuva1">2</div>
            <div class="pikkukuva" id="kuva2">3</div>
            <div class="pikkukuva" id="kuva3">4</div>
        </div>

    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        var video = document.getElementById("video");
        var canvas = document.getElementById("canvas");
        var viesti = document.getElementById("viesti");
        var lasku = document.getElementById("lasku");
        var aloitaNappi = document.getElementById("aloita-nappi");
        var nextNappi = document.getElementById("next-nappi");

        var kuvia = 4;
        var valittuAika = 3;
        var sekunnit = 0;
        var kuvaNumero = 0;
        var ajastin;
        var otetutKuvat = [];

        var haku = window.location.search;
        var layoutNimi = "Layout A";

        if (haku == "?layout=B") {
            kuvia = 3;
            layoutNimi = "Layout B";
        } else if (haku == "?layout=C") {
            kuvia = 2;
            layoutNimi = "Layout C";
        }

        document.getElementById("layout-teksti").innerHTML = "Selected layout:<br>" + layoutNimi + " (" + kuvia + " pose)";
        aloitaNappi.innerHTML = "Start Capture<br>(" + kuvia + " photos)";

        for (var i = kuvia; i < 4; i++) {
            document.getElementById("kuva" + i).style.display = "none";
        }

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                video.srcObject = stream;
                viesti.style.display = "none";
                aloitaNappi.disabled = false;
            })
            .catch(function() {
                viesti.innerHTML = "Camera blocked. Please allow the camera.";
            });

        function valitseAika(aika) {
            valittuAika = aika;
            document.getElementById("aika-3").classList.remove("valittu");
            document.getElementById("aika-5").classList.remove("valittu");
            document.getElementById("aika-" + aika).classList.add("valittu");
        }

        function aloitaKuvaus() {
            otetutKuvat = [];
            kuvaNumero = 0;

            for (var i = 0; i < kuvia; i++) {
                document.getElementById("kuva" + i).innerHTML = i + 1;
            }

            aloitaNappi.disabled = true;
            nextNappi.disabled = true;
            aloitaLasku();
        }

        function aloitaLasku() {
            sekunnit = valittuAika;
            lasku.innerHTML = sekunnit;
            lasku.style.display = "block";
            ajastin = setInterval(laskeAlas, 1000);
        }

        function laskeAlas() {
            sekunnit = sekunnit - 1;

            if (sekunnit > 0) {
                lasku.innerHTML = sekunnit;
            } else {
                clearInterval(ajastin);
                lasku.style.display = "none";
                otaKuva();
                kuvaNumero = kuvaNumero + 1;

                if (kuvaNumero < kuvia) {
                    setTimeout(aloitaLasku, 1000);
                } else {
                    aloitaNappi.innerHTML = "Retake<br>(" + kuvia + " photos)";
                    aloitaNappi.disabled = false;
                    nextNappi.disabled = false;
                }
            }
        }

        function otaKuva() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            var ctx = canvas.getContext("2d");
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            var kuva = canvas.toDataURL("image/jpeg");
            otetutKuvat.push(kuva);
            document.getElementById("kuva" + kuvaNumero).innerHTML = '<img src="' + kuva + '">';
        }

        function seuraava() {
            sessionStorage.setItem("posemoment-kuvat", JSON.stringify(otetutKuvat));
            window.location.href = "result.html";
        }
    </script>
</body>
</html>
