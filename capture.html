<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseMoment - Capture</title>
    
    <style>
        body {
          margin: 0;
          padding: 20px;
          background-color: #ffd2e1;
          font-family: Playfair Display;
          display: flex;
          flex-direction: column;  
          align-items: center;     
        }

        .ylapalkki-säiliö {
          display: flex;
          justify-content: center; 
          align-items: center;     
          width: 100%;
          max-width: 1200px;       
          margin-top: 10px;
          margin-bottom: 40px;
          position: relative; 
          box-sizing: border-box;
        }

        .ylapalkki-logo-laatikko {
          position: absolute;
          left: 0; 
          display: flex;
          align-items: center;
        }

        .ylapalkki-logo {
          width: 100%;
          max-width: 220px; 
          height: auto;
          display: block;
        }

        .kapseli-valikko {
          display: inline-flex;
          border: 2px solid #000000;
          border-radius: 30px;
          overflow: hidden;
          background-color: #ffffff;
          padding: 0;
          margin: 0;
          z-index: 10;
        }

        .kapseli-valikko a {
          display: block;
          padding: 10px 24px; 
          color: #000000;
          text-decoration: none;
          font-size: 18px; 
          font-weight: 500;
          letter-spacing: 2px;
          text-align: center;
          border-right: 2px solid #000000; 
        }

        .kapseli-valikko a:last-child {
          border-right: none;
        }

        .kapseli-valikko a:hover {
          font-weight: bold;
          background-color: #f0f0f0;
        }

        .paaosa {
          display: flex;
          justify-content: center;
          align-items: flex-start;
          gap: 40px;
          margin-top: 10px;
        }

        .kamera-sarake {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
        }

        .musta-laatikko {
          background-color: #000000;
          color: #ffffff;
          font-size: 14px;
          letter-spacing: 3px;
          padding: 6px 14px;
          text-align: center;
        }

        .kamera-ruutu {
          position: relative;
          width: 640px;
          height: 400px;
          background-color: #ffffff;
          border: 1px solid #000000;
          overflow: hidden;
        }

        .kamera-ruutu video {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transform: scaleX(-1);
        }

        .viesti {
          position: absolute;
          top: 45%;
          width: 100%;
          text-align: center;
          font-size: 20px;
          color: #000000;
          font-weight: bold;
        }

        .lasku {
          display: none;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          text-align: center;
          font-size: 140px;
          line-height: 400px;
          color: #ffffff;
          text-shadow: 0 0 15px #000000;
          z-index: 5;
        }

        .valahdys {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: #ffffff;
          opacity: 0;
          z-index: 6;
          pointer-events: none;
        }

        .aika-nappi {
          background-color: #000000;
          color: #ffffff;
          border: 2px solid #000000;
          font-family: 'Playfair Display', serif;
          font-size: 14px;
          padding: 6px 14px;
          cursor: pointer;
        }

        .valittu {
          background-color: #ffffff;
          color: #000000;
        }

        .valkoinen-nappi {
          background-color: #ffffff;
          border: 1px solid #000000;
          border-radius: 10px;
          box-shadow: 4px 4px 0 #000000;
          padding: 12px 28px;
          font-family: 'Playfair Display', serif;
          font-size: 16px;
          letter-spacing: 3px;
          cursor: pointer;
        }

        .musta-nappi {
          background-color: #000000;
          color: #ffffff;
          border: none;
          padding: 12px 30px;
          font-family: 'Playfair Display', serif;
          font-size: 18px;
          letter-spacing: 2px;
          cursor: pointer;
          text-transform: uppercase;
        }

        .musta-nappi:hover {
          background-color: #71797E;
        }

        button:disabled {
          opacity: 0.4;
          cursor: not-allowed;
        }

        .pikkukuvat {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        .pikkukuva {
          width: 110px;
          height: 68px;
          border: 1px solid #000000;
          background-color: #ffe9f0;
          text-align: center;
          line-height: 68px;
          font-size: 22px;
          color: #707070;
          overflow: hidden;
        }

        .pikkukuva img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
          transform: scaleX(-1); 
        }

        @media screen and (max-width: 1150px) {
          body {
            padding: 15px;
          }
          
          .ylapalkki-säiliö {
            flex-direction: column !important; 
            position: static !important;
            gap: 15px;
            margin-bottom: 20px !important;
          }

          .ylapalkki-logo-laatikko {
            position: static !important;
            margin: 0 auto !important;
          }

          .ylapalkki-logo {
            max-width: 150px;
          }

          .kapseli-valikko {
            display: flex !important;
            width: 100% !important;
            border-radius: 25px !important;
          }

          .kapseli-valikko a {
            flex: 1 !important;
            padding: 12px 0 !important; 
            font-size: 11px !important; 
            letter-spacing: 0px !important;
          }

          .paaosa {
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 20px;
          }

          .kamera-ruutu {
            width: 100%;
            max-width: 640px;
            height: 300px;
          }

          .lasku {
            font-size: 90px;
            line-height: 300px;
          }

          .pikkukuvat {
            flex-direction: row;
          }
        }
    </style>
</head>
<body>

    <div class="ylapalkki-säiliö">
        <div class="ylapalkki-logo-laatikko">
            <img src="Logo.jpg" alt="PoseMoment" class="ylapalkki-logo">
        </div>
        
        <nav class="kapseli-valikko">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="skills.html">Skills</a>
          <a href="contact.html">Contact</a>
        </nav>
    </div>

    <div class="paaosa">

        <div class="kamera-sarake">
            <div class="musta-laatikko" id="layout-teksti">Selected layout:<br>Loading...</div>

            <div class="kamera-ruutu">
                <video id="video" autoplay playsinline muted></video>
                <div class="viesti" id="viesti">Starting camera...</div>
                <div class="lasku" id="lasku"></div>
                <div class="valahdys" id="valahdys"></div>
            </div>

            <div>
                <span class="musta-laatikko">Time to pose:</span>
                <button class="aika-nappi valittu" id="aika-3" onclick="valitseAika(3)">3s</button>
                <button class="aika-nappi" id="aika-5" onclick="valitseAika(5)">5s</button>
            </div>

            <div>
                <button class="valkoinen-nappi" id="aloita-nappi" onclick="aloitaKuvaus()" disabled>Start Capture</button>
                <button class="musta-nappi" id="next-nappi" onclick="seuraava()" disabled>Next</button>
            </div>
        </div>

        <div class="pikkukuvat">
            <div class="pikkukuva" id="kuva0">1</div>
            <div class="pikkukuva" id="kuva1">2</div>
            <div class="pikkukuva" id="kuva2">3</div>
            <div class="pikkukuva" id="kuva3">4</div>
        </div>

    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        var video = document.getElementById("video");
        var canvas = document.getElementById("canvas");
        var viesti = document.getElementById("viesti");
        var lasku = document.getElementById("lasku");
        var valahdys = document.getElementById("valahdys");
        var aloitaNappi = document.getElementById("aloita-nappi");
        var nextNappi = document.getElementById("next-nappi");

        var tallennettuLayout = localStorage.getItem("valittuLayout") || "Layout A (4 pose)";
        var kuvia = parseInt(localStorage.getItem("kuvienMaara")) || 4;
        
        var kuvausaika = 3; 
        var otetutKuvat = 0;
        var kuvatutDataUrlit = [];
