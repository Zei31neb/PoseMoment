<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseMoment - Capture</title>
    
    <style>
        body {
          margin: 0;
          padding: 20px;
          background-color: #ffd2e1;
          font-family: Playfair Display, serif;
          display: flex;
          flex-direction: column;  
          align-items: center;     
        }

        .ylapalkki-säiliö {
          display: flex;
          justify-content: center; 
          align-items: center;
          width: 100%;             
          margin-top: 10px;
          margin-bottom: 15px;  
          position: relative; 
        }

        .ylapalkki-logo {
          position: absolute;
          left: 0;
          max-width: 280px;
          height: auto;
          display: block;
          margin-top: 40px;
        }

        .kapseli-valikko {
          display: inline-flex;
          border: 2px solid #000000;
          border-radius: 30px;
          overflow: hidden;
          background-color: #ffffff;
          padding: 0;
          margin: 0;
          z-index: 10;
        }

        .kapseli-valikko a {
          display: block;
          padding: 10px 24px; 
          color: #000000;
          text-decoration: none;
          font-size: 18px; 
          font-weight: 500;
          letter-spacing: 2px;
          text-align: center;
          border-right: 2px solid #000000; 
        }

        .kapseli-valikko a:last-child {
          border-right: none;
        }

        .studio-säiliö {
          display: flex;
          justify-content: center;
          align-items: flex-start;
          gap: 60px;
          max-width: 1200px;
          width: 100%;
          margin-top: 70px;
          position: relative;
        }

        .kuvaus-puoli {
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .status-rivi {
          display: flex;
          gap: 15px;
          margin-bottom: 15px;
          width: 500px;
        }

        .layout-status {
          background-color: #000000;
          color: #ffffff;
          padding: 6px 15px;
          font-size: 15px;
          letter-spacing: 1px;
          flex: 1;
          text-align: center;
        }

        .ajastin-valinta-palkki {
          background-color: #000000;
          color: #ffffff;
          padding: 6px 15px;
          font-size: 15px;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .ajastin-valinta-palkki select {
          font-family: Playfair Display, serif;
          font-size: 14px;
          padding: 2px 5px;
          border: 1px solid #ffffff;
          background-color: #ffffff;
          color: #000000;
          cursor: pointer;
        }

        .kamera-ruutu {
          width: 500px;
          height: 375px;
          border: 2px solid #000000;
          background-color: #ffffff;
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          box-shadow: 4px 4px 0px #000000;
        }

        #webcam {
          width: 100%;
          height: 100%;
          object-fit: cover;
          background-color: #ffffff;
        }

        #countdown-overlay {
          position: absolute;
          font-size: 110px;
          font-weight: bold;
          color: #ffffff; 
          text-shadow: 3px 3px 0px #000000; 
          display: none;
          z-index: 5;
        }

        .ajastin-palkki {
          background-color: #000000;
          color: #ffffff;
          padding: 8px 25px;
          font-size: 18px;
          margin-top: 20px;
          margin-bottom: 20px;
          letter-spacing: 1px;
          display: flex;
          align-items: center;
        }

        .ajastin-palkki span {
          background-color: #ffffff;
          color: #000000;
          padding: 2px 12px;
          margin-left: 15px;
          font-weight: bold;
          border: 1px solid #000000;
        }

        .start-nappi {
          background-color: #ffffff;
          color: #000000;
          border: 2px solid #000000;
          border-radius: 20px;
          padding: 12px 45px;
          font-family: Playfair Display, serif;
          font-size: 18px;
          cursor: pointer;
          box-shadow: 4px 4px 0px #000000;
        }

        .kuvanauha-puoli {
          display: flex;
          flex-direction: column;
          gap: 15px;
          width: 140px;
        }

        .otettu-kuva-ruutu {
          width: 140px;
          height: 105px;
          border: 2px solid #000000;
          background-color: #ffffff;
          overflow: hidden;
          box-shadow: 3px 3px 0px #000000;
        }

        .otettu-kuva-ruutu img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        #hidden-canvas {
          display: none;
        }

        .tahti-koriste {
          font-size: 60px;
          color: #707070;
          position: absolute;
          user-select: none;
        }
    </style>
</head>
<body>

    <div class="ylapalkki-säiliö">
        <img src="Logo.jpg" alt="PoseMoment" class="ylapalkki-logo">
        <nav class="kapseli-valikko">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="skills.html">Skills</a>
          <a href="contact.html">Contact</a>
        </nav>
    </div>

    <div class="tahti-koriste" style="top: 280px; left: 80px;">✦</div>
    <div class="tahti-koriste" style="top: 200px; right: 350px;">✦</div>
    <div class="tahti-koriste" style="bottom: 80px; right: 100px;">✦</div>

    <div class="studio-säiliö">
        
        <div class="kuvaus-puoli">
            <div class="status-rivi">
                <div class="layout-status" id="layout-title">Selected layout: Loading...</div>
                
                <div class="ajastin-valinta-palkki">
                    <label for="timer-select">Timer:</label>
                    <select id="timer-select">
                        <option value="3">3s</option>
                        <option value="5">5s</option>
                        <option value="10">10s</option>
                    </select>
                </div>
            </div>
            
            <div class="kamera-ruutu">
                <video id="webcam" autoplay playsinline></video>
                <div id="countdown-overlay">3</div>
            </div>

            <div class="ajastin-palkki">Time to pose: <span id="timer-number">--</span></div>
            
            <button class="start-nappi" id="start-btn" onclick="kaynnistaKuvaus()">Start Capture</button>
        </div>

        <div class="kuvanauha-puoli" id="preview-container"></div>

    </div>

    <canvas id="hidden-canvas" width="640" height="480"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('hidden-canvas');
        const startBtn = document.getElementById('start-btn');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const timerNumber = document.getElementById('timer-number');
        const previewContainer = document.getElementById('preview-container');
        const timerSelect = document.getElementById('timer-select');

        const urlParams = new URLSearchParams(window.location.search);
        const valittuLayout = urlParams.get('layout') || 'A';
        
        let kuvienMaara = 4;
        if (valittuLayout === 'B') kuvienMaara = 3;
        if (valittuLayout === 'C') kuvienMaara = 2;

        document.getElementById('layout-title').innerText = `Layout ${valittuLayout} (${kuvienMaara} pose)`;
        startBtn.innerHTML = `Start Capture<br>(${kuvienMaara} photos)`;

        for (let i = 0; i < kuvienMaara; i++) {
            const ruutu = document.createElement('div');
            ruutu.className = 'otettu-kuva-ruutu';
            ruutu.id = `ruutu-${i}`;
            previewContainer.appendChild(ruutu);
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(error) {
                alert("Please allow camera access to take photos :)");
            });
        }

        let nykyinenKuva = 0;

        function kaynnistaKuvaus() {
            startBtn.disabled = true;
            timerSelect.disabled = true; 
            nykyinenKuva = 0;
            otetaanSeuraavaKuva();
        }

        function otetaanSeuraavaKuva() {
            if (nykyinenKuva >= kuvienMaara) {
                setTimeout(function() {
                    alert("All photos captured! Moving to the next section...");
                }, 1500);
                return;
            }

            let sekunnit = parseInt(timerSelect.value);
